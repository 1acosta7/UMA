<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Uma</title>
<script
  src="https://clerk.askuma.io/npm/@clerk/clerk-js@5.127.1/dist/clerk.browser.js"
  data-clerk-publishable-key="pk_live_Y2xlcmsuYXNrdW1hLmlvJA"
  crossorigin="anonymous">
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0B1220; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
.logo { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #378ADD, #1B9E5E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.tagline { font-size: 12px; color: #8CA2C0; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
#sign-in { width: 100%; max-width: 400px; }
.back { margin-top: 24px; color: #8CA2C0; font-size: 13px; text-decoration: none; display: block; text-align: center; }
.back:hover { color: #E8EDF5; }
</style>
</head>
<body>
<div class="logo">uma</div>
<div class="tagline">Underwriting Made Accessible</div>
<div id="sign-in"></div>
<a href="/index.html" class="back">← Back to home</a>
<script>
// A referral link can arrive two ways: the explicit /login.html?ref=CODE
// form, or the clean /CODE form that netlify.toml rewrites into this page.
// That rewrite is server-side only -- Netlify serves this page's content
// for /CODE but never updates window.location to the "to" target, so the
// ?ref= query string in netlify.toml's redirect is invisible here; the
// browser still sees the original path, which is exactly what falling back
// to pathname picks up. Stashed in localStorage (not sessionStorage --
// Clerk's sign-in/sign-up flow, or someone bouncing through "Back to home"
// and clicking "Get Started Free" again, can plausibly involve a different
// tab/window before landing back on app.html, and only localStorage
// survives that) so app.html can pick it up and call accept-referral.mjs
// once the person is actually authenticated, whether this was a brand-new
// sign-up or an existing agent signing in.
//
// Clerk's own SignIn component rewrites the URL when someone switches to
// its "Sign up" view (e.g. to /sign-up) -- observed live: clicking that
// link visibly changed the address bar. Since /:code in netlify.toml
// matches ANY single path segment, that internal navigation would hit the
// exact same redirect rule this referral link does, re-run this script,
// and -- with the old logic -- silently overwrite a real stored code with
// the bogus value "sign-up". Two guards against that now: a denylist of
// Clerk's known internal routing segments, and never overwriting a code
// that's already stored (the one that actually matters -- it means even an
// internal path this list doesn't know about yet can't clobber a real one).
(function() {
  const CLERK_INTERNAL_PATHS = [
    'login.html', 'index.html', 'app.html',
    'sign-up', 'sign-in', 'factor-one', 'factor-two',
    'verify-email-address', 'verify', 'reset-password', 'sso-callback',
  ];
  let ref = new URLSearchParams(window.location.search).get('ref');
  if (!ref) {
    const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    if (path && !CLERK_INTERNAL_PATHS.includes(path)) ref = path;
  }
  if (ref && !localStorage.getItem('pendingReferralCode')) {
    localStorage.setItem('pendingReferralCode', ref);
  }
})();

window.addEventListener('load', async function() {
  try {
    await window.Clerk.load();
    window.Clerk.mountSignIn(document.getElementById('sign-in'), {
      appearance: {
        variables: {
          colorBackground: '#131F35',
          colorInputBackground: '#1A2A45',
          colorText: '#E8EDF5',
          colorTextSecondary: '#8CA2C0',
          colorPrimary: '#378ADD',
          colorInputText: '#E8EDF5',
          borderRadius: '8px'
        },
        elements: {
          socialButtonsBlockButton: { display: 'none' },
          socialButtonsBlockButtonText: { display: 'none' },
          dividerRow: { display: 'none' }
        }
      },
      afterSignInUrl: '/app.html',
      afterSignUpUrl: '/app.html',
      fallbackRedirectUrl: '/app.html',
      signUpFallbackRedirectUrl: '/app.html'
    });
  } catch(e) {
    console.error('Clerk error:', e);
    document.getElementById('sign-in').innerHTML = '<p style="color:#E03328;text-align:center;font-size:14px">Authentication failed: ' + e.message + '</p>';
  }
});
</script>
</body>
</html>
